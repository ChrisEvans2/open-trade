[project]
name = "trading-agent"
version = "0.1.1"
description = "Single runtime for structural predictions, knowledge review and guarded execution"
requires-python = ">=3.11,<3.12"
dependencies = [
  "trading-core==0.1.0",
  "trading-quant==0.1.0",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.38,<2.1", "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.14,<2", "httpx>=0.28,<1", "pyyaml>=6.0.2,<7",
  "python-multipart>=0.0.20,<1", "psutil>=6,<8",
  "websockets==15.0.1",
]

[project.scripts]
ta = "trading_agent.cli:main"

[project.optional-dependencies]
cube = [
    "cubesandbox==0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agent"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "trading_agent/resources/prompts"
"integrations/hermes" = "trading_agent/resources/hermes"
"migrations" = "trading_agent/resources/database/migrations"
"alembic.ini" = "trading_agent/resources/database/alembic.ini"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
hermes-test = [
    "filelock>=3,<4",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
    "requests>=2,<3",
    "rich>=13,<15",
    "ruamel-yaml>=0.18,<0.19",
    "snowballstemmer>=3,<4",
    "tenacity>=9,<10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests"]
testpaths = ["tests/unit", "tests/integration", "tests/hermes"]
markers = ["postgres: requires an isolated real PostgreSQL database", "hermes: pinned Hermes contract tests", "live: external deployment acceptance"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.uv.sources]
trading-core = { path = "../packages/trading-core", editable = true }
trading-quant = { path = "../packages/trading-quant", editable = true }
