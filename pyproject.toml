[project]
name = "open-trade"
version = "0.1.0"
description = "Development workspace for the prediction runtime and shared trading libraries."
requires-python = ">=3.11"
dependencies = [
  "trading-quant==0.1.0",
  "trading-core==0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["packages/trading-core/src", "packages/trading-quant/src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
trading-quant = { path = "packages/trading-quant", editable = true }
trading-core = { path = "packages/trading-core", editable = true }
